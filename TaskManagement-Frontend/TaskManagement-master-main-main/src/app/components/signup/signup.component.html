<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">

      <h5 class="text-center fw-bold mb-1">Task Management</h5>
      <p class="text-center text-muted small mb-4">Create your account</p>

      <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
          <span class="nav-link" routerLink="/login" style="cursor: pointer;">Sign In</span>
        </li>
        <li class="nav-item">
          <span class="nav-link active">Create Account</span>
        </li>
      </ul>

      <div *ngIf="errorMessage" class="alert alert-danger py-2 small">{{ errorMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" formControlName="username" placeholder="Your username">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" placeholder="At least 6 characters">
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || loading">
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>

    </div>
  </div>
</div>
